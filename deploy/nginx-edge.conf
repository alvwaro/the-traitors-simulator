# Incluído no server do Nginx do site (frontend/nginx.conf) só na EC2.
# O Caddy fica na frente: sem isto, todo visitante teria o IP do Caddy e dividiria o mesmo limite de tentativas.
# Só a rede interna da pilha (deploy/compose.yml) é confiável; a porta do web não é publicada.
set_real_ip_from 172.28.0.0/24;
real_ip_header X-Forwarded-For;
