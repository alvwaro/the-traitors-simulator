name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build e testes ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [shared, backend, frontend, gateway]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    # Os testes do backend passam pela API de verdade, com um Postgres só para eles.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: traitors
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/traitors
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build --if-present
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.app }}
          path: ${{ matrix.app }}/coverage/lcov.info
          retention-days: 7

  docker:
    name: Imagens Docker
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile -t traitors-api .
      - run: docker build -f gateway/Dockerfile -t traitors-gateway .
      - run: docker build -f frontend/Dockerfile -t traitors-web .

  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
      - name: Coloca cada lcov na pasta do seu pacote
        run: for app in shared backend frontend gateway; do mkdir -p "$app/coverage" && mv "coverage-$app/lcov.info" "$app/coverage/lcov.info"; done
      - uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
