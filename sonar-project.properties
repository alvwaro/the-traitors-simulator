# SonarCloud — preencha organization/projectKey com os valores criados em sonarcloud.io
sonar.organization=alvwaro
sonar.projectKey=alvwaro_the-traitors-simulator
sonar.projectName=The Traitors

sonar.sourceEncoding=UTF-8
# Monorepo: kernel compartilhado (shared), backend, frontend e API Gateway.
sonar.sources=shared/src,backend/src,backend/scripts,frontend/src,gateway/src
# Migrações SQL ficam fora da análise: são PostgreSQL, e o SonarCloud trataria os .sql como PL/SQL (Oracle).
# Os testes do frontend ficam junto do código (src/**/*.test.tsx) e são lidos como testes, não como código.
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.d.ts,backend/src/infrastructure/database/migrations/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/test/**

# Testes: os do backend, do kernel e do gateway em test/; os do frontend ao lado dos componentes, mais o apoio em src/test.
sonar.tests=shared/test,backend/test,frontend/src,gateway/test
sonar.test.inclusions=shared/test/**,backend/test/**,gateway/test/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/test/**

# Cobertura gerada pelo Vitest (npm run test:coverage em cada pacote; o CI roda todos antes da análise).
sonar.javascript.lcov.reportPaths=shared/coverage/lcov.info,backend/coverage/lcov.info,frontend/coverage/lcov.info,gateway/coverage/lcov.info
# Pontos de entrada e ferramentas de linha de comando: só ligam as peças (servidor, worker, migração, scripts).
sonar.coverage.exclusions=backend/src/main/server.ts,backend/src/main/worker.ts,backend/src/infrastructure/database/migrate.ts,backend/src/infrastructure/cli/**,backend/scripts/**,frontend/src/main.tsx,gateway/src/server.ts

# Bancos de frases (texto puro) não são lógica: ficam fora da detecção de duplicação.
sonar.cpd.exclusions=backend/src/domain/simulation/dialogue/**,**/*.module.css,shared/test/**,backend/test/**,gateway/test/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/test/**
