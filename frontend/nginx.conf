# Porta de entrada do site: arquivos estáticos e /api repassado ao gateway.
server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  client_max_body_size 1m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location /api/ {
    proxy_pass http://gateway:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # O Host como o navegador mandou (com a porta): a checagem de CSRF compara com a origem da página.
    proxy_set_header Host $http_host;
    # Esta é a borda: o IP do visitante é o da conexão (substitui qualquer X-Forwarded-For recebido).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Respostas em partes (streaming) seguem na hora.
    proxy_buffering off;
    proxy_read_timeout 120s;
  }

  # Arquivos com hash no nome: podem ficar em cache para sempre.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Rotas do app (React Router): tudo que não é arquivo abre o index.html.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
