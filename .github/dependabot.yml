version: 2
updates:
  - package-ecosystem: npm
    directory: /shared
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /backend
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /gateway
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directories: [/backend, /frontend, /gateway]
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
