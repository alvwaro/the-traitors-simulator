name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build e testes ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [shared, backend, frontend, gateway]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    # Os testes do backend passam pela API de verdade, com um Postgres só para eles.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: traitors
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/traitors
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build --if-present
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.app }}
          path: ${{ matrix.app }}/coverage/lcov.info
          retention-days: 7

  # Constrói as imagens em todo PR; num push na main também publica no GHCR (a EC2 só baixa, não compila).
  docker:
    name: Imagem ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: traitors-api
            dockerfile: backend/Dockerfile
          - image: traitors-gateway
            dockerfile: gateway/Dockerfile
          - image: traitors-web
            dockerfile: frontend/Dockerfile
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Nome da imagem no GHCR (em minúsculas)
        id: name
        env:
          IMAGE: ${{ matrix.image }}
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$IMAGE" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # EC2 t3 (Intel/AMD). Para instâncias Graviton (t4g), troque por linux/arm64 (ou use as duas).
          platforms: linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ${{ steps.name.outputs.ref }}:latest
            ${{ steps.name.outputs.ref }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
      - name: Coloca cada lcov na pasta do seu pacote
        run: for app in shared backend frontend gateway; do mkdir -p "$app/coverage" && mv "coverage-$app/lcov.info" "$app/coverage/lcov.info"; done
      - uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
