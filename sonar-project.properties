# SonarCloud — preencha organization/projectKey com os valores criados em sonarcloud.io
sonar.organization=SEU_ORG_SONARCLOUD
sonar.projectKey=SEU_ORG_SONARCLOUD_the-traitors
sonar.projectName=The Traitors

sonar.sourceEncoding=UTF-8
sonar.sources=backend/src,backend/scripts,frontend/src
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.d.ts

# Bancos de frases (texto puro) e migrações SQL de seed não são lógica: ficam fora da detecção de duplicação.
sonar.cpd.exclusions=backend/src/domain/simulation/dialogue/**,backend/src/infrastructure/database/migrations/**,**/*.module.css
